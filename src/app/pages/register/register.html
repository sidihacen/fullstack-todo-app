<div class="auth-container">

  <h1>Todo App</h1>

  <h2>Créer un compte</h2>

  <input
    type="text"
    placeholder="Nom utilisateur"
    [(ngModel)]="username"
  >

  <input
    type="password"
    placeholder="Mot de passe"
    [(ngModel)]="password"
  >

  <button (click)="register()">
    Créer mon compte
  </button>

  @if (message) {
    <p>{{ message }}</p>
  }

  <p>
    Déjà un compte ?
    <a routerLink="/login">Se connecter</a>
  </p>

</div>
