<div class="auth-container">

  <h1>Todo App</h1>

  <h2>Connexion</h2>

  <input
    type="text"
    placeholder="Nom utilisateur"
    [(ngModel)]="username"
  >

  <input
    type="password"
    placeholder="Mot de passe"
    [(ngModel)]="password"
  >

  <button (click)="login()">
    Se connecter
  </button>

  @if (message) {
    <p>{{ message }}</p>
  }

  <p>
    Pas encore de compte ?
    <a routerLink="/register">S'inscrire</a>
  </p>

</div>
